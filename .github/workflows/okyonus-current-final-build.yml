name: Okyanus Current Final Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'okyonus-edt-worker/src/deniz-worker.js'
      - 'okyonus-edt-worker/src/commerce-v2.js'
      - 'okyonus-edt-worker/src/commerce-admin-v2.js'
      - 'okyonus-edt-worker/src/zaman-admin-worker.js'
      - 'okyonus-edt-worker/scripts/build-single-workers.mjs'
      - 'okyonus-edt-worker/assets/storefront/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: okyonus-edt-worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current final Workers
        run: node scripts/build-single-workers.mjs
      - name: Syntax gates
        run: |
          node --check src/deniz-worker.js
          node --check dist/deniz-worker.single.js
          node --check dist/deniz-worker.monolithic.final.js
          node --check dist/zaman-admin-worker.single.js
      - name: Contract tests
        run: npm test
      - name: Commit synchronized canonical and final files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/deniz-worker.js \
            dist/deniz-worker.single.js \
            dist/deniz-worker.monolithic.final.js \
            dist/zaman-admin-worker.single.js \
            exports/OKYANUS_DENIZ_MONOLITHIC_FINAL_V18_2026-09-30.txt \
            exports/OKYANUS_DENIZ_FINAL_R4_TAM_KOD_2026-09-30.txt \
            exports/OKYANUS_DENIZ_CURRENT_FINAL.txt \
            exports/OKYANUS_DENIZ_FINAL_2026-10-01.txt \
            exports/OKYANUS_ZAMAN_ADMIN_CURRENT_FINAL.txt
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Okyanus EDT: synchronize canonical final Worker exports"
          git push
