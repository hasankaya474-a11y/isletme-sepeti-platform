<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="İşletme Sepeti B2B satın alma platformu birleşik canlı demo: Public, Alıcı, Tedarikçi ve Admin.">
  <title>İşletme Sepeti · B2B Tedarik Platformu</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Menüyü aç">☰</button>
        <a class="brand" href="#public/home" aria-label="İşletme Sepeti ana sayfa">İşletme <strong>Sepeti</strong></a>
        <span class="env-badge">Canlı demo · sandbox veri</span>
      </div>
      <div class="top-actions">
        <label class="global-search">
          <span>⌕</span>
          <input id="globalSearch" type="search" placeholder="Ürün, sipariş, modül ara…" aria-label="Global arama">
        </label>
        <button class="icon-btn" id="notificationBtn" aria-label="Bildirimler">🔔<span class="notify-dot"></span></button>
        <button class="profile-btn" id="profileBtn"><span class="avatar">HK</span><span class="desktop-only">Demo Kullanıcı</span></button>
      </div>
    </header>

    <div class="surface-tabs" role="tablist" aria-label="Uygulama yüzleri">
      <button data-surface-tab="public">Public</button>
      <button data-surface-tab="buyer">Alıcı</button>
      <button data-surface-tab="supplier">Tedarikçi</button>
      <button data-surface-tab="admin">Admin</button>
    </div>

    <aside class="sidebar" id="sidebar" aria-label="Ana navigasyon">
      <div class="sidebar-head">
        <div>
          <small id="surfaceEyebrow">PUBLIC</small>
          <h2 id="surfaceTitle">Keşif</h2>
        </div>
        <button class="icon-btn mobile-only" id="closeMenuBtn" aria-label="Menüyü kapat">✕</button>
      </div>
      <nav id="sideNav" class="side-nav"></nav>
      <div class="sidebar-foot">
        <div class="guard-card">
          <span class="guard-dot"></span>
          <div><strong>Production kilitli</strong><small>Gerçek release kanıtı olmadan açılamaz.</small></div>
        </div>
      </div>
    </aside>

    <main class="workspace" id="workspace" tabindex="-1">
      <div id="page"></div>
    </main>
  </div>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div><small>Hızlı İşlem</small><h3 id="drawerTitle">İşlem</h3></div>
      <button class="icon-btn" id="drawerClose">✕</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script src="./app.js" defer></script>
</body>
</html>
